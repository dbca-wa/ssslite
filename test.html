<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport"
              content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="author"
              content="Department of Biodiversity, Conservation and Attractions" />
        <link rel="shortcut icon" href="favicon.ico" />
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
              integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
              crossorigin="anonymous"
              referrerpolicy="no-referrer" />
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
              integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
              crossorigin="anonymous"
              referrerpolicy="no-referrer" />
        <style>
      html,
      body {
        height: 100%;
        min-height: 100vh;
      }
      body {
        margin: 0;
      }
      #map {
        height: 100%;
        min-height: 320px;
        width: 100%;
      }
        </style>
    </head>
    <body>
        <main class="container-fluid p-0 d-flex h-100 flex-column">
            <div class="row m-0 p-0 flex-fill">
                <div class="col m-0 p-0">
                    <section aria-labelledby="map-heading" class="h-100">
                        <h1 id="map-heading" class="visually-hidden">Test map</h1>
                        <div id="map" tabindex="0" role="region" aria-describedby="map-help"></div>
                        <p id="map-help" class="visually-hidden">Use the map controls to pan and zoom. Screen reader users can use the map with the keyboard and read details in the pop-up information panels.</p>
                    </section>
                </div>
            </div>
        </main>
        <noscript>
            <div class="alert alert-warning m-3" role="alert">This map requires JavaScript.</div>
        </noscript>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
                integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw=="
                crossorigin="anonymous"
                referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
                integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
                crossorigin="anonymous"
                referrerpolicy="no-referrer"></script>
        <script src="static/test.js"></script>
    </body>
</html>
