apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -prod
resources:
  - ../../base
  - ingress.yml
  - pdb.yml
secretGenerator:
  - name: ssslite-env
    type: Opaque
    envs:
      - .env
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: webserver_patch.yml
  - path: webserver_hpa_patch.yml
  - path: service_patch.yml
images:
  - name: ghcr.io/dbca-wa/ssslite
    newTag: 1.0.11
